# --- SHADOW RATCHET de mypy (Task 10 / T3.3, rodada de correção 2) ----------
# Config do mypy usada APENAS pelo step "Type check ratchet" do CI. É a config
# do pyproject.toml SEM o bloco `[[tool.mypy.overrides]]` que aplica
# `ignore_errors = true` aos 28 arquivos do gate PARCIAL
# (docs/quality/BASELINE.md §6.6) — todo o resto é idêntico.
#
# Por que existe: manter os 28 arquivos fora de `ignore_errors` devolve os 105
# arquivos de `app/` à verificação de tipo, sem corrigir um único erro legado
# (os legados seguem medidos, não escondidos). O CI só falha se o TOTAL de erros
# CRESCER além do orçamento declarado no step (`RATCHET_BUDGET`, em
# .github/workflows/ci.yml); o rc=1 do mypy, por si só, não falha o step.
#
# Leitura: `mypy app --config-file pyproject.ratchet.toml`
#   → `Found 127 errors in 28 files (checked 105 source files)`, rc=1.
# Esse 127 é o orçamento inicial medido sobre esta config, com o pin
# mypy==2.3.1. Ao corrigir erros legados, BAIXE o orçamento no ci.yml — nunca
# suba. Se o número medido aqui mudar sem que o orçamento mude, o step falha:
# é exatamente para isso que ele existe.
#
# NÃO adicione `ignore_errors = true` a este arquivo — e se adicionar, o step NÃO
# volta a medir 0 em silêncio: ele FALHA. A chave ativa anula o ratchet (o total
# medido cai: 127 → 60 com a chave em 5 módulos, → 0 com os 28) e o step
# "Type check ratchet" do CI tem uma checagem dedicada que detecta a chave em
# qualquer grafia TOML (`ignore_errors`, com aspas duplas ou simples, em linha
# própria, indentada ou em tabela inline) desde que o valor seja `true` — e sai
# com `::error::` + exit 1. `ignore_errors = false` é o default do mypy: é inerte
# (medido: 127 erros / 28 arquivos / checked 105) e o step o aceita.
#
# (Lido com `--config-file`, que IGNORA o pyproject.toml: por isso esta config é
# autossuficiente — repete `strict = true`, `ignore_missing_imports` e o bloco
# de relaxamento dos 56 módulos legados.)

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# --- Ratchet de strict por módulo (Task 10 / T3.3, Épico 3) -----------------
# `strict = true` acima continua sendo o default GLOBAL do projeto. Os 56
# módulos abaixo são o legado ainda não anotado (de 105 arquivos em `app/`):
# neles, os checks que `strict = true` liga e que NÃO são default do mypy são
# desligados explicitamente. É isso que elimina o ruído de anotação (241
# erros de no-untyped-def / type-arg / no-any-return / no-untyped-call) e
# deixa à vista só a dívida de tipo real. `no_implicit_optional` NÃO é
# desligado aqui: é default do mypy desde 0.990 e pega bug de verdade
# (Optional implícito em parâmetro), não ruído de anotação.
# Remova um módulo desta lista quando ele for anotado — ela só deve ENCOLHER.
# ATENÇÃO: esta lista é uma CÓPIA À MÃO da de `pyproject.toml`; todo patch lá
# (remoção de módulo, mudança de flags) precisa do MESMO patch aqui — e vice-versa.
# Os outros 49 arquivos de `app/` não estão aqui: 44 continuam em strict
# pleno e 5 aparecem só no bloco de `ignore_errors` logo abaixo.
