[project]
name = "bhub-backend"
version = "1.0.0"
description = "BHUB - Plataforma de Agregação de Artigos Científicos em Análise do Comportamento"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "BHUB Team", email = "contato@bhub.com.br"}
]
keywords = ["behavior-analysis", "scientific-articles", "aggregator", "aba", "rft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    # Framework Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "starlette>=0.41.0",
    "jinja2>=3.1.4",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",

    # Autenticação
    "fastapi-users[sqlalchemy]>=14.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # Validação
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # HTTP Client
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",

    # RSS/Feed Parsing
    "feedparser>=6.0.11",
    "python-dateutil>=2.9.0",

    # Web Scraping
    "beautifulsoup4>=4.12.3",
    "selectolax>=0.3.27",
    "lxml>=5.3.0",

    # PDF Processing
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",

    # Machine Learning
    "sentence-transformers>=3.3.0",
    "torch>=2.5.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",

    # Jobs/Scheduling
    "apscheduler>=3.10.4",
    "arq>=0.26.1",
    "redis[hiredis]>=5.0",

    # Logging
    "loguru>=0.7.2",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",

    # Image Processing
    "pillow>=11.0.0",

    # Utilities
    "python-slugify>=8.0.4",
    "tenacity>=9.0.0",
    "aiofiles>=24.1.0",

    # Rate Limiting
    "slowapi>=0.1.9",

    # Timezone
    "pytz>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff==0.16.7",
    # Fixado de propósito: `mypy app` é BLOQUEANTE no CI (Task 10 / T3.3),
    # então a versão do type checker precisa ser determinística.
    # Validado com 2.3.1 (mesma versão do requirements-dev.txt).
    "mypy==2.3.1",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Testes: parâmetros de fixture do pytest são resolvidos POR NOME, então renomear
# para `_x` quebra a injeção; fakes e lambdas precisam manter a aridade da
# assinatura real (ex.: `FakeDB.execute(self, stmt)`, `lambda *args, **kwargs`).
# Ignorar ARG aqui é a decisão correta, não dívida.
"tests/**" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# --- Ratchet de strict por módulo (Task 10 / T3.3, Épico 3) -----------------
# `strict = true` acima continua sendo o default GLOBAL do projeto. Os 56
# módulos abaixo são o legado ainda não anotado (de 105 arquivos em `app/`):
# neles, os checks que `strict = true` liga e que NÃO são default do mypy são
# desligados explicitamente. É isso que elimina o ruído de anotação (241
# erros de no-untyped-def / type-arg / no-any-return / no-untyped-call) e
# deixa à vista só a dívida de tipo real. `no_implicit_optional` NÃO é
# desligado aqui: é default do mypy desde 0.990 e pega bug de verdade
# (Optional implícito em parâmetro), não ruído de anotação.
# Remova um módulo desta lista quando ele for anotado — ela só deve ENCOLHER.
# ATENÇÃO: esta lista é DUPLICADA À MÃO em `pyproject.ratchet.toml` (o bloco de
# relaxamento do shadow ratchet, que roda esta MESMA config sem `ignore_errors`).
# Todo patch aqui precisa do MESMO patch lá: se a cópia do ratchet relaxar mais
# do que este arquivo, ela esconde erro do contador em vez de contá-lo.
# Os outros 49 arquivos de `app/` não estão aqui: 44 continuam em strict
# pleno e 5 aparecem só no bloco de `ignore_errors` logo abaixo.
#
# LEITURA DAS CONTAGENS (`# N`) DESTE BLOCO — é OUTRA medição, não a mesma do
# bloco 2: aqui, N = erros medidos sob `strict = true` (config de BASE, ANTES do
# relaxamento acima) — o tamanho do problema a anotar neste módulo. Somam 354;
# com os 15 dos 5 módulos que só aparecem no bloco 2, fecham os 369 erros da
# config de BASE (`Found 369 errors in 61 files`, medido com mypy==2.3.1). As
# contagens do bloco 2 (`ignore_errors`) medem outra coisa: os erros REAIS
# remanescentes DEPOIS do relaxamento, que somam 127. Por isso
# `app.services.web_scraper` aparece com 43 aqui e 36 lá (43 inclui o ruído de
# anotação que o relaxamento elimina; 36 é o erro de tipo que sobra) — duas
# medidas diferentes do mesmo módulo, não uma inconsistência.
[[tool.mypy.overrides]]
module = [
    "app.services.web_scraper",  # 43
    "app.web.routes",  # 30
    "app.services.article_parser",  # 27
    "app.ai.model_manager",  # 16
    "app.api.v1.admin.articles",  # 16
    "app.ai.manager",  # 15
    "app.main",  # 14
    "app.services.pdf_service",  # 14
    "app.core.security",  # 12
    "app.ml.embedding_classifier",  # 12
    "app.api.v1.admin.feeds",  # 10
    "app.ai.local_llm_service",  # 8
    "app.core.refresh_token",  # 8
    "app.api.v1.ai",  # 7
    "app.jobs.scheduler",  # 7
    "app.web.admin",  # 7
    "app.api.v1.admin.analytics",  # 6
    "app.api.v1.articles",  # 6
    "app.core.rate_limiting",  # 6
    "app.services.feed_aggregator",  # 6
    "app.api.v1.opengraph",  # 5
    "app.api.v1.search",  # 5
    "app.core.cookie_transport",  # 5
    "app.core.csrf_middleware",  # 4
    "app.interfaces.services",  # 4
    "app.services.classification_service",  # 4
    "app.api.auth",  # 3
    "app.api.v1.categories",  # 3
    "app.config",  # 3
    "app.core.logging",  # 3
    "app.core.scheduler_lock",  # 3
    "app.services.translation_cache_service",  # 3
    "app.web.auth",  # 3
    "app.api.v1.admin.stats",  # 2
    "app.api.v1.analytics",  # 2
    "app.api.v1.banners",  # 2
    "app.api.v1.feeds",  # 2
    "app.core.access_token_cookie_middleware",  # 2
    "app.core.alerting",  # 2
    "app.core.auth_cookie_middleware",  # 2
    "app.core.csrf",  # 2
    "app.core.log_sanitizer",  # 2
    "app.core.security_headers",  # 2
    "app.database",  # 2
    "app.jobs.observe",  # 2
    "app.services.search_service",  # 2
    "app.api.deps",  # 1
    "app.api.v1.authors",  # 1
    "app.api.v1.contact",  # 1
    "app.api.v1.csrf",  # 1
    "app.interfaces.task_queue",  # 1
    "app.ml.impact_rating",  # 1
    "app.models.analytics",  # 1
    "app.schemas.feed",  # 1
    "app.services.background_tasks",  # 1
    "app.web.translation",  # 1
]
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
warn_unused_ignores = false
warn_return_any = false
no_implicit_reexport = false
strict_equality = false
extra_checks = false

# --- Gate PARCIAL: 28 de 105 arquivos ficam FORA da verificação --------------
# Com o relaxamento acima ativo e SEM este bloco, o mypy ainda acusa 127 erros
# REAIS (union-attr, assignment, attr-defined, arg-type, ...) em 28 módulos.
# Medição a strictness default pura (sem nenhum override): 126 erros nos MESMOS
# 28 arquivos — a diferença de 1 é um diagnóstico de reexport implícito vindo
# de dependência de terceiro (app/ai/model_manager.py:9), porque o `strict`
# global também vale para os módulos de terceiros que o mypy analisa.
# Estes erros NÃO foram corrigidos: T3.3 é task de CI, não de tipagem do
# codebase. Estão ignorados ARQUIVO A ARQUIVO, com a contagem ao lado, para o
# ratchet pós-release encolher a lista um a um. Nada de glob largo aqui:
# qualquer módulo fora desta lista é verificado de verdade.
# Este total (127) não é decorativo: o shadow ratchet do CI
# (`pyproject.ratchet.toml` + step "Type check ratchet") roda esta MESMA config
# SEM este bloco e falha se o total crescer — é ele que garante que um erro
# novo em qualquer dos 28 arquivos acima seja visto. Ele NÃO valida comentário
# por comentário: o número dele é a referência. Ao corrigir erros legados,
# baixe o orçamento `RATCHET_BUDGET` em `.github/workflows/ci.yml`.
[[tool.mypy.overrides]]
module = [
    "app.services.web_scraper",  # 36
    "app.web.routes",  # 18
    "app.ai.model_manager",  # 11
    "app.ml.embedding_classifier",  # 8
    "app.services.opengraph_service",  # 7
    "app.api.v1.admin.articles",  # 6
    "app.services.pdf_service",  # 5
    "app.ai.local_llm_service",  # 4
    "app.ml",  # 4
    "app.services.article_parser",  # 4
    "app.web.admin",  # 3
    "app.api.v1.ai",  # 2
    "app.api.v1.search",  # 2
    "app.core.cookie_transport",  # 2
    "app.services.analytics_service",  # 2
    "app.api.v1.admin.feeds",  # 1
    "app.api.v1.articles",  # 1
    "app.config",  # 1
    "app.core.ip_anonymization",  # 1
    "app.core.log_sanitizer",  # 1
    "app.core.rate_limiting",  # 1
    "app.core.refresh_token",  # 1
    "app.core.scheduler_lock",  # 1
    "app.jobs.observe",  # 1
    "app.jobs.tasks",  # 1
    "app.main",  # 1
    "app.services.feed_aggregator",  # 1
    "app.services.translation_cache_service",  # 1
]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short"
