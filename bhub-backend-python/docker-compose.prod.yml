# BHUB Backend - Production stack (PostgreSQL + Redis + ARQ worker)
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d
#
# Banco: PostgreSQL (escolha de produção — escrita concorrente entre backend,
# arq-worker e scheduler; busca full-text via TSVECTOR/GIN/pg_trgm).
# Config sensível (SECRET_KEY, POSTGRES_PASSWORD, chaves de IA) vem do .env.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bhub-backend-python-backend:latest
    container_name: bhub-backend
    restart: unless-stopped
    # Atrás do Traefik (TLS + domínio bhub.online). Publicado só no loopback:
    # acesso público é via https://bhub.online; a porta 8000 não fica exposta.
    ports:
      - "127.0.0.1:8000:8000"
    # --proxy-headers + forwarded-allow-ips: confia no X-Forwarded-* do Traefik
    # para que esquema https e IP real do cliente cheguem ao app (rate limit,
    # anonimização LGPD, analytics). Seguro pois a porta só escuta em 127.0.0.1.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://bhub:bhub@db:5432/bhub}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ENABLE_ARQ=${ENABLE_ARQ:-true}
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no .env}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - ENABLE_SCHEDULER=${ENABLE_SCHEDULER:-true}
      # Analytics interno (LGPD): coleta só com ENABLE_ANALYTICS=true E consentimento
      # do visitante na categoria "analytics" (app/core/cookie_consent.py)
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-false}
      - ANALYTICS_RESPECT_DNT=${ANALYTICS_RESPECT_DNT:-true}
      - COOKIE_CONSENT_ENABLED=${COOKIE_CONSENT_ENABLED:-true}
      - COOKIE_CONSENT_VERSION=${COOKIE_CONSENT_VERSION:-1.0}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  arq-worker:
    image: bhub-backend-python-backend:latest
    container_name: bhub-arq-worker
    restart: unless-stopped
    command: arq app.jobs.tasks.WorkerSettings
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://bhub:bhub@db:5432/bhub}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - ENABLE_ARQ=true
      - SECRET_KEY=${SECRET_KEY:?defina SECRET_KEY no .env}
      - DEBUG=${DEBUG:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - ENABLE_SCHEDULER=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Worker não tem servidor HTTP — sem healthcheck (liveness via arq + restart).
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: bhub-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-bhub}
      - POSTGRES_USER=${POSTGRES_USER:-bhub}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhub} -d ${POSTGRES_DB:-bhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: bhub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
