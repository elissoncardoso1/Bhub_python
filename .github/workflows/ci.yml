name: CI

on:
  push:
    branches: [main]
  pull_request:

# A aplicação vive em bhub-backend-python/; rodamos o CI a partir de lá.
defaults:
  run:
    working-directory: bhub-backend-python

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bhub-backend-python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lint e formatter são BLOQUEANTES: a dívida de Ruff foi zerada na Task 9
      # (Épico 3 / T3.2). Não reintroduza `continue-on-error` aqui.
      - name: Lint (ruff check)
        run: ruff check app tests

      - name: Format check (ruff format --check)
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v
