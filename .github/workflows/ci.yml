name: CI

on:
  push:
    branches: [main]
  pull_request:

# A aplicação vive em bhub-backend-python/; rodamos o CI a partir de lá.
defaults:
  run:
    working-directory: bhub-backend-python

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bhub-backend-python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lint e formatter são BLOQUEANTES: a dívida de Ruff foi zerada na Task 9
      # (Épico 3 / T3.2). Não reintroduza `continue-on-error` aqui.
      - name: Lint (ruff check)
        run: ruff check app tests

      - name: Format check (ruff format --check)
        run: ruff format --check .

      # Type check BLOQUEANTE (Épico 3 / T3.3). `strict = true` é o default
      # global em pyproject.toml; os módulos legados que ainda falham estão
      # enumerados em [[tool.mypy.overrides]] (strict relaxado em 56, e
      # ignore_errors em 28 arquivos, nomeados um a um com sua contagem).
      # O gate é PARCIAL de propósito: ver docs/quality/BASELINE.md §6.
      # Não use `continue-on-error` aqui.
      - name: Type check (mypy app)
        run: mypy app

      - name: Run tests
        run: pytest tests/ -v

      # Piso de cobertura BLOQUEANTE (Épico 3 / T3.4). Baseline medido:
      # 3752/6338 statements = 59,2%, logo o piso é 59%. Suba o número
      # conforme o ratchet avançar — nunca desça.
      # A suíte roda de novo aqui (~10 s) para que a regressão de cobertura
      # apareça como step próprio no log do CI, e não escondida no step de testes.
      - name: Coverage floor (fail under 59%)
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=59
