name: CI

on:
  push:
    branches: [main]
  pull_request:

# A aplicação vive em bhub-backend-python/; rodamos o CI a partir de lá.
defaults:
  run:
    working-directory: bhub-backend-python

jobs:
  test:
    name: Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    # Teto do JOB (rodada de correção 1). O default do GitHub é 360 min: um HANG de
    # rede em qualquer step penduraria o job por horas. Os steps de instalação/teste
    # duram minutos, e o build da imagem tem teto próprio de 40 min logo abaixo
    # (duas tentativas de um build frio, medido em 307 s na máquina do implementador).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bhub-backend-python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Lint e formatter são BLOQUEANTES: a dívida de Ruff foi zerada na Task 9
      # (Épico 3 / T3.2). Não reintroduza `continue-on-error` aqui.
      - name: Lint (ruff check)
        run: ruff check app tests

      - name: Format check (ruff format --check)
        run: ruff format --check .

      # Type check BLOQUEANTE (Épico 3 / T3.3) — mas PARCIAL. Este é o rótulo
      # correto do critério "Mypy bloqueia PR" / "mypy app passa" (Task 19):
      # vale SOB o gate parcial de docs/quality/BASELINE.md §6.6.
      # `strict = true` é o default global em pyproject.toml; os módulos legados
      # estão enumerados em [[tool.mypy.overrides]]: strict relaxado em 56 e
      # `ignore_errors = true` em 28 arquivos (26,7% de `app/`, incluindo
      # app/web/routes.py, app/main.py e app/config.py), que ficam FORA de
      # qualquer verificação — erro NOVO neles NÃO falha este step.
      # Quem cobre essa lacuna é o step "Type check ratchet" logo abaixo.
      # Não use `continue-on-error` aqui.
      - name: Type check (mypy app)
        run: mypy app

      # SHADOW RATCHET (rodada de correção 2; endurecido nas rodadas 3, 4 e 5):
      # roda a MESMA config sem o bloco de `ignore_errors` (pyproject.ratchet.toml)
      # e devolve os 105 arquivos à verificação — erro novo em QUALQUER arquivo,
      # inclusive nos 28 fora do gate principal, passa a falhar. A ressalva: o
      # invariante só vale enquanto a config do ratchet não for AFROUXADA. O guard
      # abaixo barra `ignore_errors` ATIVO (valor `true`) nestas grafias: chave sem
      # aspas, com aspas duplas ou com aspas simples, em linha própria (indentada ou
      # não) e dentro de tabela inline (`{ module = [...], ignore_errors = true }`).
      # A enumeração é do que o guard casa — NÃO é exaustiva. Ficam FORA dela, por
      # exemplo, (a) a chave depois de um `#` dentro de string (o `sed 's/#.*//'` corta
      # a linha antes dela) e (b) a chave com escape unicode (`"\u0069gnore_errors"`,
      # que o `tomllib` decodifica para o nome real; idem `"\U00000069gnore_errors"`):
      # o guard não casa nenhuma das duas E o mypy as HONRA — medido nesta rodada, a
      # chave escapada em `app.web.routes` (127 − 18, a contagem do §6.3) dá
      # `Found 109 errors in 27 files (checked 105 source files)`, o MESMO efeito do
      # cenário 28 do harness. ATENÇÃO: o cenário 28 é grafia COBERTA (o harness espera
      # FAIL e o guard casa) e é citado ali só como MEDIDA DO EFEITO (127 → 109), nunca
      # como exemplo de grafia fora da enumeração. Nem outras relaxações
      # (`disable_error_code`, `follow_imports`) que baixam o total sem serem pegas:
      # ver "LIMITE INERENTE do desenho por contagem" em docs/quality/BASELINE.md §6.8
      # (conserto estrutural: follow-up, não feito).
      # Não corrige nenhum erro legado: o legado medido É o orçamento abaixo.
      # O mypy SAI COM rc=1 nesta config (é o esperado: há 127 erros), então o rc
      # não decide nada por si: o que decide é o resumo extraído. Por isso o step é
      # FAIL CLOSED — falha (exit 1) em entrada inválida (forma OU magnitude),
      # resumo inesperado, `ignore_errors` reativado na config do ratchet ou
      # redução silenciosa de escopo, em vez de tratar erro de shell como aprovação.
      # A lógica é coberta por bhub-backend-python/tests/ci/ratchet_step_harness.sh
      # (executa ESTE bloco verbatim, com stub de mypy) — e o step
      # "Run ratchet step harness" logo abaixo executa o harness no CI.
      - name: Type check ratchet (mypy shadow, budget 127)
        run: |
          # FONTE ÚNICA DE VERDADE desta dupla (orçamento, escopo). Medição com
          # mypy==2.3.1, sobre app/:
          #   $ mypy app --config-file pyproject.ratchet.toml    # rc=1
          #   Found 127 errors in 28 files (checked 105 source files)
          #   $ mypy app                                          # rc=0
          #   Success: no issues found in 105 source files
          # 105 é o TOTAL de arquivos que as duas configs checam. NÃO confunda com
          # o 56 do bloco de relaxamento de strict: 56 é a quantidade de MÓDULOS em
          # [[tool.mypy.overrides]], não o escopo checado.
          # BAIXE o orçamento ao corrigir erros legados (e atualize o nome deste
          # step); nunca suba sem justificar no mesmo PR o aumento da dívida.
          RATCHET_BUDGET=127
          EXPECTED_SOURCE_FILES=105
          # Caminho da config do ratchet numa variável (fonte única: é ELA que o mypy
          # lê e é ELA que o guard de `ignore_errors` abaixo inspeciona). O harness
          # (tests/ci/ratchet_step_harness.sh) substitui esta linha para apontar para
          # uma cópia degradada em /tmp, sem tocar a árvore.
          RATCHET_CONFIG=pyproject.ratchet.toml
          rc=0
          mypy app --config-file "$RATCHET_CONFIG" > /tmp/mypy-ratchet.txt 2>&1 || rc=$?
          cat /tmp/mypy-ratchet.txt
          if [ "$rc" -gt 1 ]; then
            echo "::error::mypy ratchet saiu com rc=$rc (esperado 0 ou 1) — falha de execução, não divergência de contagem."
            exit 1
          fi
          # FAIL CLOSED #0 — a config do ratchet não pode reativar `ignore_errors`
          # (rodada de correção 4 / Important #2). `ignore_errors = true` NÃO reduz
          # `(checked N source files)` — o mypy segue lendo os 105 arquivos —, então o
          # gate de ESCOPO abaixo PASSA e o total cai para 0: o step sairia 0 com o
          # shadow ratchet anulado (medido: `Success: no issues found in 105 source
          # files`, rc=0, com o bloco aplicado aos 28 módulos). Quem protege contra
          # isso é ESTA checagem, e não a asserção de escopo.
          # A busca ignora COMENTÁRIOS (o `sed` corta do `#` até o fim da linha) e
          # reconhece a CHAVE em linha própria, indentada ou dentro de tabela inline
          # (`{ module = [...], ignore_errors = true }`), INCLUSIVE CITADA —
          # `"ignore_errors"` (aspas duplas) e `'ignore_errors'` (aspas simples) são o
          # MESMO nome em TOML e o mypy as HONRA: sem o `("|')?` o step saía verde com
          # o ratchet parcialmente anulado (medido com o mypy real: o bloco citado em
          # 5 módulos derruba 127 → 60, mantendo `(checked 105 source files)`).
          # Não basta a PRESENÇA da chave: o valor tem de ser o literal `true`, o único
          # que anula o ratchet. `ignore_errors = false` é o DEFAULT do mypy, é inerte
          # (medido: 127 erros / 28 arquivos / checked 105) e o step o ACEITA — a
          # rodada de correção 5 corrigiu o falso vermelho que ele gerava.
          # O prefixo `(^|[[:space:],{])` exige que o token comece ali, para não casar
          # nome de módulo/valor que contenha o texto (`"app.x.ignore_errors"`).
          # LIMITE DECLARADO: isto cobre ESTA chave, com os valores acima. Outra
          # relaxação da config do ratchet (`disable_error_code`, `follow_imports`)
          # baixa o total do mesmo jeito e NÃO é pega aqui — é o "LIMITE INERENTE do
          # desenho por contagem" documentado em docs/quality/BASELINE.md §6.8, com o
          # conserto estrutural registrado lá como follow-up (não implementado).
          if [ ! -f "$RATCHET_CONFIG" ]; then
            echo "::error::config do ratchet não encontrada em '$RATCHET_CONFIG' — sem config não há verificação (e o guard de ignore_errors não teria o que inspecionar): o gate falha fechado."
            exit 1
          fi
          if sed 's/#.*//' "$RATCHET_CONFIG" | grep -qE "(^|[[:space:],{])(\"|')?ignore_errors(\"|')?[[:space:]]*=[[:space:]]*true"; then
            echo "::error::$RATCHET_CONFIG tem a chave ATIVA 'ignore_errors' (valor 'true'): isso ANULA o ratchet. O mypy continua checando os 105 arquivos (o gate de escopo passa), mas para de reportar os erros do legado — o total medido cai (medido com o mypy real: 127 → 60 com a chave em 5 módulos, → 0 com os 28) e o step sai verde sem medir a dívida. Remova a chave da config do ratchet (mencioná-la em comentário é permitido; 'ignore_errors = false' é o default do mypy, é inerte e é aceito)."
            exit 1
          fi
          # FAIL CLOSED #1 — validar os OPERANDOS antes de qualquer comparação
          # (rodada de correção 3 / C1, endurecida na rodada de correção 4 /
          # Important #1). Duas classes de entrada inválida, com o MESMO efeito:
          # `[ "$total" -gt "$RATCHET_BUDGET" ]` sai com erro e, dentro de `if` sob
          # `bash -e`, isso é simplesmente condição falsa — o step imprime OK e sai 0.
          #   (a) FORMA: `127,`, vazio, `abc` → "integer expression expected";
          #   (b) MAGNITUDE: `^[0-9]+$` aceitava inteiro de tamanho arbitrário e o
          #       `test` estoura o int64 (limite 2^63). Medido: budget
          #       99999999999999999999 (ou 9223372036854775808) + `Found 999 errors
          #       in 28 files (checked 105 source files)` → rc=0 imprimindo
          #       `OK: linha do legado intacta (999 <= 99999…)`. Por isso o teto de 9
          #       dígitos (`{1,9}`, até 999.999.999): folgado para orçamento e escopo,
          #       imune ao overflow. Vale para os dois operandos do step E para
          #       `total`/`checked` extraídos do mypy, que passam pelas MESMAS
          #       comparações.
          if ! [[ "$RATCHET_BUDGET" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::RATCHET_BUDGET inválido: '$RATCHET_BUDGET' — esperado inteiro não negativo de até 9 dígitos (typo clássico: '127,'; inteiro acima de int64 estouraria a comparação e viraria condição falsa). O gate falha fechado: entrada inválida não aprova nada."
            exit 1
          fi
          if ! [[ "$EXPECTED_SOURCE_FILES" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::EXPECTED_SOURCE_FILES inválido: '$EXPECTED_SOURCE_FILES' — esperado inteiro não negativo de até 9 dígitos (a comparação de escopo estouraria o int64). O gate falha fechado."
            exit 1
          fi
          # FAIL CLOSED #2 — parsing do resumo (rodada de correção 3 / C3). O resumo
          # relevante é a ÚLTIMA linha de resultado do mypy: um `head -n 1` fica com
          # a PRIMEIRA ocorrência, e um resumo intermediário mascararia o final
          # (ex.: 'Found 3 errors in 1 file' antes de 'Found 200 errors in 28
          # files'). Os DOIS números são extraídos da MESMA linha, para não casar o
          # total de uma com o escopo de outra. Uso `sed` (e não `grep`) para não
          # depender de `set -o pipefail` nem abortar sob `bash -e` quando não há
          # match — quem decide é a validação explícita abaixo, não o rc do pipe.
          summary=$(sed -nE '/^Found [0-9]+ errors? in |^Success: no issues found/p' /tmp/mypy-ratchet.txt | tail -n 1)
          total=""
          checked=""
          case "$summary" in
            Found\ *)
              total=$(printf '%s\n' "$summary" | sed -nE 's/^Found ([0-9]+) errors? in .*/\1/p')
              checked=$(printf '%s\n' "$summary" | sed -nE 's/^.*\(checked ([0-9]+) source files\).*$/\1/p')
              ;;
            Success:\ *)
              total=0
              checked=$(printf '%s\n' "$summary" | sed -nE 's/^Success: no issues found in ([0-9]+) source files.*$/\1/p')
              ;;
          esac
          # Sem resumo reconhecido, ou com número não numérico, o step FALHA: parsing
          # duvidoso não pode passar como aprovação. O teto de dígitos é o mesmo dos
          # operandos declarados (ver FAIL CLOSED #1): um número de 20 dígitos vindo do
          # mypy estouraria a comparação lá adiante.
          if [ -z "$summary" ] || [ -z "$total" ] || ! [[ "$total" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::não foi possível extrair de forma confiável o total de erros do resumo do ratchet (última linha de resultado: '$summary') — falha de parsing NÃO pode passar como aprovação."
            exit 1
          fi
          if [ -z "$checked" ] || ! [[ "$checked" =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::não foi possível extrair de forma confiável a contagem de source files checados ('(checked N source files)') do resumo do ratchet (última linha de resultado: '$summary') — falha de parsing NÃO pode passar como aprovação."
            exit 1
          fi
          echo "Shadow ratchet: $total erro(s) medido(s); orçamento: $RATCHET_BUDGET; escopo checado: $checked source file(s); escopo esperado: $EXPECTED_SOURCE_FILES."
          # FAIL CLOSED #3 — o escopo tem de continuar sendo a árvore inteira
          # (rodada de correção 3 / C2, escopo do claim corrigido na rodada 4).
          # Uma config degradada por acidente (`exclude`/`files` mais estreitos, ou
          # arquivo novo/removido em app/) reduz o escopo e passaria verde num gate
          # que só olhasse a contagem de erros — ex.: "Found 0 errors in 3 source
          # files". ATENÇÃO ao limite desta asserção: `ignore_errors` NÃO muda
          # `checked` (segue 105) e por isso NÃO é pego aqui — quem o pega é o
          # FAIL CLOSED #0 (checagem dedicada da config), não esta comparação.
          if [ "$checked" -ne "$EXPECTED_SOURCE_FILES" ]; then
            echo "::error::escopo do ratchet divergente: mypy checou $checked source file(s), esperado $EXPECTED_SOURCE_FILES. Config de mypy alterada (exclude/files, arquivo novo/removido em app/) — corrija a config e atualize EXPECTED_SOURCE_FILES no mesmo PR, com o motivo. (Esta asserção NÃO detecta ignore_errors: para esse caso o erro vem do FAIL CLOSED #0.)"
            exit 1
          fi
          if [ "$total" -gt "$RATCHET_BUDGET" ]; then
            echo "::error::regressão de tipos: $total > $RATCHET_BUDGET — corrija o erro novo (qualquer arquivo, inclusive os fora do gate principal) ou suba o orçamento no mesmo PR, com a dívida nova registrada em docs/quality/BASELINE.md §6.3."
            exit 1
          fi
          echo "OK: linha do legado intacta ($total <= $RATCHET_BUDGET) e escopo intacto ($checked source files)."

      # AUTOTESTE DO GATE ACIMA (Low #3 da rodada de correção 4). O step do
      # ratchet decide por TEXTO extraído, e as rodadas 3, 4 e 5 fecharam 5 classes de
      # falso verde (operando inválido de forma e de magnitude, escopo degradado,
      # parsing, `ignore_errors` reativado) — todas com cenário congelado em
      # bhub-backend-python/tests/ci/ratchet_step_harness.sh. Um artefato de
      # verificação que ninguém executa apodrece: este step roda o harness no CI
      # para que uma edição futura no step acima que reabra um falso verde fique
      # VERMELHA aqui, em vez de passar só porque ninguém rodou o harness.
      # Custo: <1 s, sem rede, sem mypy real (o harness usa stub) e sem tocar a
      # árvore. Os 2 cenários de cobertura real da suíte ficam de fora de propósito
      # (opt-in por RATCHET_HARNESS_COVERAGE=1): neste runner o venv é o global, e o
      # step "Coverage floor" logo abaixo já cobre a suíte real.
      - name: Run ratchet step harness
        run: bash tests/ci/ratchet_step_harness.sh

      - name: Run tests
        run: pytest tests/ -v

      # Piso de cobertura BLOQUEANTE (Épico 3 / T3.4). Baseline medido no HEAD
      # atual: 3752/6338 statements = 59,1985% (cru). O piso é 59,19 COM
      # `--cov-precision=2`: o coverage decide por
      # `round(total, precision) < fail_under` (coverage/results.py:503), então
      # 3752 cobertos (59,1985% → 59,20) passa e 3751 (59,1827% → 59,18) falha.
      # Piso efetivo: >= 3752 statements cobertos (≈ 59,19%; o valor cru é
      # 59,1985% — por isso "≈" e não "="), isto é,
      # "nenhum statement coberto no baseline pode ser perdido" — contra os
      # 58,50% (3708 statements) que o antigo `--cov-fail-under=59` com a
      # precisão default 0 permitia: 44 statements de folga.
      # Suba o número conforme o ratchet avançar — nunca desça.
      # (A rodada de correção 2 usou `--cov-precision=1 --cov-fail-under=59.2`,
      # mesmo valor em p.p. e piso efetivo mais alto em statements. Além disso a
      # precisão 2 remove uma mensagem enganosa: o resumo do pytest-cov 7.1.0
      # compara o total CRU com o fail_under SEM aplicar a precisão
      # (pytest_cov/plugin.py:413), então com o 59.2 nominal ele imprimia
      # "FAIL Required test coverage of 59.2% not reached" em TODA execução
      # verde — o cru é 59,1985, abaixo do 59,2 nominal. Com 59.19 as duas
      # checagens (crua e arredondada) concordam em todo inteiro alcançável:
      # 3752 → verde e log limpo; 3751 → vermelho nas duas.)
      # Não "conserte" um log de cobertura baixando o piso: o rc é a fonte da
      # verdade.
      # A suíte roda de novo aqui (~10 s) para que a regressão de cobertura
      # apareça como step próprio no log do CI, e não escondida no step de testes.
      - name: Coverage floor (fail under 59.19%, precision 2, >= 3752 statements)
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-precision=2 \
            --cov-fail-under=59.19

      # SUÍTE DE INTEGRAÇÃO com infraestrutura REAL (Épico 4 / T4.1).
      # Existe porque nenhum teste unitário prova que a cadeia de migrações roda num
      # PostgreSQL de verdade, nem que o `search_vector` da 008 é um `tsvector` real:
      # a suíte roda `alembic upgrade head` num banco VAZIO, como o deploy faz
      # (`scripts/vps/deploy.sh`), e inspeciona o catálogo do Postgres.
      # As fixtures (`bhub-backend-python/tests/integration/conftest.py`) sobem os
      # próprios containers com a CLI `docker` — `postgres:16-alpine` e
      # `redis:7-alpine`, as MESMAS imagens do `docker-compose.yml` do repo, com
      # banco de nome único por execução. Por isso NÃO há bloco `services:`: um
      # caminho só, igual em CI e na máquina de quem desenvolve, e o que o
      # mantenedor verifica localmente é exatamente o que roda aqui.
      # Isso consome rede (o runner baixa as duas imagens do Docker Hub) e por isso
      # roda depois dos steps baratos e antes do build da imagem, que é o mais caro.
      # Docker ausente é FALHA, nunca `skip`: a fixture levanta erro com mensagem
      # clara, porque um verde falso aqui esconderia uma migração quebrada.
      # A suíte é DESMARCADA por padrão (`-m 'not integration'` no `addopts`), então
      # os steps "Run tests" e "Coverage floor" seguem rodando só os testes unitários
      # numa máquina sem Docker; aqui o `-m integration` da linha de comando
      # sobrepõe o do `addopts`.
      # Não use `continue-on-error` aqui.
      - name: Testes de integração (PostgreSQL e Redis reais)
        timeout-minutes: 15
        run: pytest tests/integration -m integration -v

      # Build da imagem Docker BLOQUEANTE (Épico 3 / T3.5). Existe para pegar cedo
      # dependência ausente, pacote de sistema incompatível, erro de build e arquivo não
      # copiado — as quatro classes que os `RUN`/`COPY` do Dockerfile cobrem e que nenhum
      # dos gates acima toca. Constrói o `Dockerfile`, e não o `Dockerfile.prod`, porque é
      # ELE o do caminho real de deploy: o `docker-compose.prod.yml` de
      # `bhub-backend-python/` — o stack de produção com Postgres/Redis/`arq-worker` que
      # `scripts/vps/deploy.sh` e `scripts/vps/update.sh` sobem com `up -d --build` —
      # aponta para `dockerfile: Dockerfile`; o `Dockerfile.prod` só é referenciado pelo
      # `docker-compose.prod.yml` da RAIZ, que monta um stack com um `./Frontend` que não
      # existe neste repositório. O contexto `.` é a raiz de `bhub-backend-python/` (o
      # working-directory do job), exatamente o contexto que aquele compose usa.
      # Custo: minutos, e ele consome rede (apt Debian, PyPI, índice CPU do PyTorch e o
      # modelo do `sentence-transformers` no HuggingFace) — nenhum segredo, nenhum
      # `--build-arg`. Por isso roda por ÚLTIMO: a ordem do job é barato→caro.
      # Não há `.dockerignore` neste diretório, então o `COPY . .` leva o que estiver na
      # árvore de trabalho (no CI, os caches de ruff/mypy/pytest e o `coverage.xml`;
      # numa máquina de dev, o `.venv`): follow-up nomeado, não feito aqui.
      # Não use `continue-on-error` aqui: build quebrado tem de deixar o PR VERMELHO.
      # MITIGAÇÃO DE INFRA (rodada de correção 1 / Important I1): o build depende de
      # QUATRO serviços externos — repos Debian (apt), PyPI, o índice CPU do PyTorch e o
      # download do modelo no HuggingFace (este último sem `||` de fallback) —, então
      # instabilidade de infra deixa o PR vermelho por motivo alheio ao código, e nada
      # limitava a espera (o default do GitHub, 360 min, penduraria um HANG de download).
      # Por isso: (a) `timeout-minutes` no step (40) E no job (60 — ver o topo do job) e
      # (b) UM retry do MESMO comando, com `::warning::` no log. Um erro REAL de build
      # falha nas duas tentativas: isto não mascara defeito de código, só a classe
      # "infra". Se o step ficar vermelho, RE-RODE antes de culpar o código (o retry já
      # rodou uma vez; o `::warning::` deixa isso no log). Um timeout, se disparar, NÃO
      # é retentado — quem mata o step é o runner.
      # Dimensionamento: o build frio mediu 307 s (5 min) na máquina do implementador;
      # o runner, sem cache de camada, precisa de folga para as DUAS tentativas — 40 min
      # cobre isso com margem e ainda limita o HANG.
      - name: Build da imagem Docker (Dockerfile do deploy)
        timeout-minutes: 40
        run: |
          docker build -f Dockerfile . || {
            echo "::warning::build falhou; 1 retry (apt/PyPI/PyTorch/HuggingFace são externos) — se falhar de novo, é o PR."
            docker build -f Dockerfile .
          }
